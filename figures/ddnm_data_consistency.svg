<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 838" width="1180" height="838" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="DDNM reconstruction: at every reverse diffusion step the U-Net predicts a clean estimate, then k-space data consistency replaces the sampled rows with the measured data and keeps the prior's guess on the unsampled rows.">
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0.5,0.5 L9,5 L0.5,9.5 Z" fill="#16283B"/>
  </marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0.5,0.5 L9,5 L0.5,9.5 Z" fill="#0E7C86"/>
  </marker>
</defs>
<text x="590.0" y="40.0" text-anchor="middle" font-size="23" font-weight="700" fill="#16283B">Our model — DDNM k-space data consistency</text>
<text x="590.0" y="66.0" text-anchor="middle" font-size="14" font-weight="400" fill="#5B6B7B">A single unconditional diffusion prior reconstructs every acceleration ratio; only the sampling mask changes.</text>
<text x="70.0" y="118.0" text-anchor="start" font-size="15" font-weight="700" fill="#16283B">One reverse-diffusion step   (repeat for t = T−1, …, 0)</text>
<rect x="70" y="150" width="120" height="78" rx="9" fill="#F4F6F8" stroke="#16283B" stroke-width="2"/>
<text x="130.0" y="184.0" text-anchor="middle" font-size="15" font-weight="600" fill="#16283B">xₜ</text>
<text x="130.0" y="204.0" text-anchor="middle" font-size="15" font-weight="600" fill="#16283B">noisy image</text>
<text x="130.0" y="136.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5B6B7B">xₜ ← N(0, I) at t = T−1</text>
<rect x="238" y="150" width="150" height="78" rx="9" fill="#FFFFFF" stroke="#16283B" stroke-width="2"/>
<text x="313.0" y="184.0" text-anchor="middle" font-size="15" font-weight="600" fill="#16283B">U-Net  εθ(xₜ, t)</text>
<text x="313.0" y="204.0" text-anchor="middle" font-size="15" font-weight="600" fill="#16283B">denoiser (prior)</text>
<line x1="190.0" y1="189.0" x2="236.0" y2="189.0" stroke="#16283B" stroke-width="2.2" marker-end="url(#arw)"/>
<rect x="436" y="150" width="152" height="78" rx="9" fill="#FFFFFF" stroke="#16283B" stroke-width="2"/>
