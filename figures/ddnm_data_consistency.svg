<text x="991.0" y="204.0" text-anchor="middle" font-size="15" font-weight="600" fill="#16283B">DDIM / DDPM step</text>
<line x1="868.0" y1="189.0" x2="914.0" y2="189.0" stroke="#0E7C86" stroke-width="2.2" marker-end="url(#arwA)"/>
