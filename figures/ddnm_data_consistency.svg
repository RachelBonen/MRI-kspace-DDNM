<text x="512.0" y="204.0" text-anchor="middle" font-size="15" font-weight="600" fill="#16283B">predicted clean image</text>
<line x1="388.0" y1="189.0" x2="434.0" y2="189.0" stroke="#16283B" stroke-width="2.2" marker-end="url(#arw)"/>
<text x="512.0" y="136.0" text-anchor="middle" font-size="12" font-weight="400" fill="#5B6B7B">Tweedie / predict_x0</text>
<rect x="636" y="142" width="232" height="94" rx="9" fill="#D8EEF0" stroke="#0E7C86" stroke-width="2.6"/>
